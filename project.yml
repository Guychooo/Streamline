name: Streamline
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  StreamCore:
    path: Packages/StreamCore

targets:
  Streamline:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: StreamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streamline
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Streamline
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          # Some add-ons serve media over plain HTTP; allow it for AVFoundation only.
          NSAllowsArbitraryLoadsForMedia: true
          # Lets you test add-ons running on your own Mac or local network.
          NSAllowsLocalNetworking: true

schemes:
  Streamline:
    build:
      targets:
        Streamline: all
    run:
      config: Debug
