<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Streamline</title>
  <meta name="description" content="Stream video from Stremio-compatible add-ons on iPhone.">
  <meta name="theme-color" content="#0d1017">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Streamline">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="screen-title">Discover</h1>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#/discover" data-tab="discover">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H4zM8 20h8M10 9.5v4l3.5-2z"/></svg>
      <span>Discover</span>
    </a>
    <a href="#/search" data-tab="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <span>Search</span>
    </a>
    <a href="#/library" data-tab="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15.2 5.2l2.9-.8 3.6 14.6-2.9.8z"/></svg>
      <span>Library</span>
    </a>
    <a href="#/addons" data-tab="addons">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v4a2 2 0 1 0 0 0h5v6h-4a2 2 0 1 0 0 4h4v2H4V8h5z"/></svg>
      <span>Add-ons</span>
    </a>
  </nav>

  <div id="player-root" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
